site_name: Code Snippets Collection
site_description: A curated collection of useful code snippets with syntax highlighting and copy functionality
site_author: DC Digitanie
site_url: https://dcdigitanie.github.io/code-snippets-docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.select
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - meta
  - admonition
  - pymdownx.details

nav:
  - Home: index.md
  - Snippets:
    - Python: snippets/python.md
    - JavaScript: snippets/javascript.md
    - SQL: snippets/sql.md
    - Bash: snippets/bash.md
    - Other: snippets/other.md
  - About: about.md
